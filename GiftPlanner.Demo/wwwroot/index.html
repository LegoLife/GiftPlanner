<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>GiftPlanner demo</title>
    <base href="/" />
    <link rel="icon" type="image/svg+xml" href="favicon.svg" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" />
    <link rel="stylesheet" href="_content/MudBlazor/MudBlazor.min.css" />
    <link rel="stylesheet" href="app.css" />
    <link rel="stylesheet" href="GiftPlanner.Demo.styles.css" />
    <style>
        .gp-loading { font-family: Inter, system-ui, sans-serif; display: grid; place-items: center; height: 100vh; color: #555; }
    </style>
</head>
<body>
    <div id="app"><div class="gp-loading">Loading the GiftPlanner demo…</div></div>
    <div id="blazor-error-ui" style="display:none">Something went wrong. <a href="" class="reload">Reload</a></div>
    <script>
        window.gpTheme = {
            get: () => { try { return localStorage.getItem("gp.theme"); } catch { return null; } },
            set: v => { try { localStorage.setItem("gp.theme", v); } catch { } }
        };
        window.gpCopy = async text => {
            try { await navigator.clipboard.writeText(text); return true; } catch { return false; }
        };
    </script>
    <script src="_framework/blazor.webassembly.js"></script>
    <script src="_content/MudBlazor/MudBlazor.min.js"></script>
</body>
</html>
